[package]
name = "orb-player"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orb-engine = { path = "../orb-engine" }
# Audio output (task-040).
cpal = "0.18.2"
# The lock-free single-producer single-consumer queues between the UI thread and the callback.
rtrb = "0.4.1"
# The lock-free snapshot the callback publishes and the UI thread reads.
triple_buffer = "9.0.0"
# The resampler for a device that does not offer 44.1 kHz (sinc only: no FFT resampler).
rubato = { version = "5.0.1", default-features = false }

# ASIO on x86_64 Windows (task-193): cpal's `asio` feature builds asio-sys, which needs LLVM
# (bindgen) and the SDK subset in third_party/asiosdk (CPAL_ASIO_DIR, set by
# .cargo/config.toml). Not on Windows arm64 (its x64 ASIO drivers load only into an x64
# process: the x64 package runs there under emulation).
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
cpal = { version = "0.18.2", features = ["asio"] }

# The ASIO probe test (tests/asio_probe.rs, task-252) calls asio-sys directly.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dev-dependencies]
asio-sys = "0.4.0"

[dev-dependencies]
rbs = { path = "../rbs" }
# The recrypted mods of the mod-change sessions (tests/live_messages.rs).
rbm = { path = "../rbm" }
# The gated tests' external inputs (task-121).
orb-testkit = { path = "../orb-testkit" }
serde_json = "1"
sha2 = "0.10"
