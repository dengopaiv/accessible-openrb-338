[package]
name = "orb-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The desktop UI: the panel drawn from the SVG art set (assets/ui) with egui"

[lib]
path = "src/lib.rs"

# The file name is the process name the macOS Dock and Activity Monitor show (task-104).
[[bin]]
name = "OpenRB-338"
path = "src/main.rs"

[dependencies]
orb-engine = { path = "../orb-engine" }
# The player the panel drives (task-045) and its audio output.
orb-player = { path = "../orb-player" }
# Song files and the standard mod (the built-in drum samples).
rbs = { path = "../rbs" }
rbm = { path = "../rbm" }
# The export and the mod lookup of `orb render` (task-047).
orb-cli = { path = "../orb-cli" }
# The settings file (task-107).
serde = { version = "1", features = ["derive"] }
toml = "=0.9.12"
eframe = "0.37.0"
# The run log (task-214) takes the libraries' messages (wgpu, winit, eframe, cpal, AccessKit);
# the version they use.
log = "0.4"
egui_extras = { version = "0.37.0", features = ["svg"] }
# Renders the window icon and gives the panel's part rasterizing its options; the version
# egui_extras' SVG loader uses.
resvg = { version = "0.45.1", default-features = false }
# Saves the --screenshot PNG; decodes the mods' splash.jpg.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# The native message box of the crash hook (task-157). No default features: on Linux the
# box is run by `zenity` at run time (no GTK or other system library to link), and the Wayland
# window-identifier code is not needed for a box without a parent window.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The window handles that make the app's window the owner of the system file dialogs
# (task-194); the version eframe, winit and rfd use.
raw-window-handle = "0.6"

# The message hook that tells the numpad's keys apart (task-225): the extension trait of the
# event loop builder; the version eframe uses (no new crate).
[target.'cfg(windows)'.dependencies]
winit = { version = "0.30.13", default-features = false }

[dev-dependencies]
orb-ui-art = { path = "../orb-ui-art" }
# The gated tests' external inputs (task-121).
orb-testkit = { path = "../orb-testkit" }
tempfile = "3.27.0"

[build-dependencies]
embed-resource = "3"
