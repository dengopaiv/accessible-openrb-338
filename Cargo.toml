[workspace]
resolver = "3"
members = ["crates/rbs", "crates/orb-engine", "crates/orb-cli", "crates/rbm", "crates/orb-player", "crates/orb-ui-art", "crates/orb-ui", "crates/orb-testkit", "crates/orb-plugin", "xtask"]
# Patched copies of crates.io crates (the [patch.crates-io] below), not members.
exclude = ["vendor"]

# raw-window-metal 1.1.0 (MIT OR Apache-2.0, wgpu's macOS surface) with its layer class
# registered under a name unique to the loaded image: with the fixed name
# "RawWindowMetalLayer" the second plugin image in one process (a second
# wgpu plugin in the host) panicked opening its editor and aborted the host (task-201,
# docs/plugin.md "The vendored raw-window-metal").
[patch.crates-io]
raw-window-metal = { path = "vendor/raw-window-metal" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# `cargo test` builds optimized (the unoptimized run of the corpus tests takes many minutes) but
# keeps debug_assertions and overflow-checks, which it inherits from dev, so the tests still see
# the engine's debug asserts and its integer overflow checks. The profile applies to every unit
# `cargo test` builds (the workspace libraries, the test binaries and the dependencies); the
# build scripts and proc macros stay at the dev settings. Output goes to target/debug.
[profile.test]
opt-level = 3
debug = "line-tables-only"

# The SHA-256 of the 128 MB RB20FUL.DAT (rbm::dat) takes seconds unoptimized: the tests of
# `orb mod recrypt` hash a stand-in file several times.
[profile.dev.package.sha2]
opt-level = 3

# The profile of the packages (scripts/build.sh, docs/building.md): link-time optimization costs
# a long build, so `cargo build --release` stays as it is for everyday work. Panics stay unwinding.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
